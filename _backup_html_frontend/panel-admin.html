<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroRent - Panel de Administración</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos específicos para el Dashboard */
        .metricas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .metrica-card {
            background-color: var(--color-pure-white);
            border-radius: var(--radius-card);
            padding: 35px 30px;
            text-align: left;
            border: none;
            position: relative;
            overflow: hidden;
            transition: var(--transition-smooth);
            animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* Animación de entrada para las tarjetas */
        @keyframes scaleIn {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .metrica-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        }

        .metrica-card h3 {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #6d6d6d;
            margin-bottom: 15px;
        }

        .metrica-card p {
            font-family: var(--font-serif);
            font-size: 48px;
            font-weight: 400;
            color: var(--color-charcoal);
            margin: 0;
            line-height: 1;
        }

        /* Colores pastel de Arva para las tarjetas */
        .card-sage { background-color: var(--color-sage-card); }
        .card-peach { background-color: var(--color-peach-card); }
        .card-sky { background-color: var(--color-sky-card); }
        .card-forest { 
            background-color: var(--color-forest-ink); 
            color: white;
        }
        
        .card-forest h3 { color: rgba(255,255,255,0.7); }
        .card-forest p { color: white; }

        /* Retraso para que aparezcan una tras otra */
        .metrica-card:nth-child(1) { animation-delay: 0.1s; }
        .metrica-card:nth-child(2) { animation-delay: 0.2s; }
        .metrica-card:nth-child(3) { animation-delay: 0.3s; }
        .metrica-card:nth-child(4) { animation-delay: 0.4s; }
    </style>
</head>
<body>

    <div class="container" style="animation: slideUpFade 0.5s ease;">
        <h2>Resumen del Sistema</h2>
        <p style="color: #6d6d6d; font-size: 16px;">Métricas globales de la plataforma AgroRent en tiempo real.</p>

        <div class="metricas-grid">
            <!-- Tarjeta 1: Usuarios -->
            <div class="metrica-card card-sage">
                <h3>Usuarios Registrados</h3>
                <p id="totalUsuarios">-</p>
            </div>
            
            <!-- Tarjeta 2: Maquinaria -->
            <div class="metrica-card card-peach">
                <h3>Maquinaria Registrada</h3>
                <p id="totalMaquinas">-</p>
            </div>
            
            <!-- Tarjeta 3: Reservas -->
            <div class="metrica-card card-sky">
                <h3>Reservas Activas</h3>
                <p id="totalReservas">-</p>
            </div>
            
            <!-- Tarjeta 4: Ingresos -->
            <div class="metrica-card card-forest">
                <h3>Ingresos Confirmados</h3>
                <p id="totalIngresos">-</p>
            </div>
        </div>
    </div>

    <script>
        // 1. VALIDACIÓN DE SESIÓN Y ROL ADMIN
        const usuario = (() => {
            try { return JSON.parse(localStorage.getItem('agrorent_usuario')); }
            catch (e) { return null; }
        })();

        if (!usuario || usuario.rol !== 3) {
            window.location.href = 'index.html';
        } else {
            // Cargar métricas al iniciar
            document.addEventListener('DOMContentLoaded', cargarMetricas);
            if (document.readyState !== 'loading') cargarMetricas();
        }

        // 2. LÓGICA DE MÉTRICAS
        async function cargarMetricas() {
            try {
                const respuesta = await fetch('/api/admin/metricas');
                if (!respuesta.ok) throw new Error('Respuesta ' + respuesta.status);

                const data = await respuesta.json();

                // Animación de conteo para que se vea más profesional
                animarNumero('totalUsuarios', data.usuarios_registrados);
                animarNumero('totalMaquinas', data.maquinaria_registrada);
                animarNumero('totalReservas', data.reservas_activas);
                
                // Formatear ingresos a moneda chilena
                document.getElementById('totalIngresos').innerText =
                    '$' + Number(data.ingresos_estimados).toLocaleString('es-CL');

            } catch (error) {
                console.error('Error al cargar métricas', error);
            }
        }

        // Función para animar los números del 0 al valor real
        function animarNumero(idElemento, valorFinal) {
            const elemento = document.getElementById(idElemento);
            let valorActual = 0;
            const duracion = 1000; // 1 segundo
            const pasos = 30;
            const incremento = valorFinal / pasos;
            
            let pasoActual = 0;
            const intervalo = setInterval(() => {
                pasoActual++;
                valorActual += incremento;
                
                if (pasoActual >= pasos) {
                    elemento.innerText = valorFinal;
                    clearInterval(intervalo);
                } else {
                    elemento.innerText = Math.floor(valorActual);
                }
            }, duracion / pasos);
        }
    </script>
    <script src="header.js"></script>
</body>
</html>
