<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroRent - Catálogo de Maquinaria</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="abrirTab(event, 'tab-catalogo')">Catálogo de Máquinas</button>
            <button class="tab-btn" onclick="abrirTab(event, 'tab-mis-reservas')">Mis Reservas</button>
        </div>

        <div id="tab-catalogo" class="tab-content active">
            <div class="card">
                <h2>Maquinaria Disponible</h2>
                
                <div style="display: flex; gap: 15px; margin-bottom: 30px;">
                    <input type="text" id="inputBusqueda" placeholder="Buscar por marca, modelo o descripción..." style="flex: 1;">
                    <button class="btn" onclick="cargarMaquinaria()">Buscar</button>
                </div>

                <table id="tablaMaquinaria">
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Precio/Día</th>
                            <th>Descripción</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="tab-mis-reservas" class="tab-content">
            <div class="card">
                <h2>Mi Historial de Reservas</h2>
                <table id="tablaMisReservas">
                    <thead>
                        <tr>
                            <th>ID Reserva</th>
                            <th>Máquina</th>
                            <th>Fechas</th>
                            <th>Costo</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const usuarioGuardado = JSON.parse(localStorage.getItem('agrorent_usuario'));
        const idProductor = usuarioGuardado ? usuarioGuardado.id_productor : null;
        
        if (!idProductor) {
            window.location.href = 'index.html';
        }

        function abrirTab(evt, tabName) {
            let tabcontent = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabcontent.length; i++) {
                tabcontent[i].classList.remove("active");
            }
            let tablinks = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarMaquinaria();
            cargarMisReservas();
            document.getElementById('inputBusqueda').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') cargarMaquinaria();
            });
        });

        async function cargarMaquinaria() {
            try {
                const busqueda = document.getElementById('inputBusqueda').value;
                const url = busqueda ? `/api/maquinaria/buscar?busqueda=${busqueda}` : '/api/maquinaria/buscar';
                
                const respuesta = await fetch(url);
                const maquinas = await respuesta.json();
                
                const tbody = document.querySelector('#tablaMaquinaria tbody');
                tbody.innerHTML = ''; 

                if (maquinas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #6d6d6d;">No se encontraron máquinas disponibles.</td></tr>';
                    return;
                }

                maquinas.forEach(maquina => {
                    const fotoHTML = maquina.foto 
                        ? `<img src="${maquina.foto}" alt="${maquina.marca}" style="width: 80px; height: 60px; object-fit: cover; border-radius: 8px;">` 
                        : `<div style="width: 80px; height: 60px; background: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #999;">Sin foto</div>`;

                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${fotoHTML}</td>
                        <td><strong>${maquina.marca}</strong></td>
                        <td>${maquina.modelo}</td>
                        <td>$${maquina.precio_dia}</td>
                        <td>${maquina.descripcion}</td>
                        <td>
                            <!-- CAMBIO: Ahora el botón dice "Ver más detalles" -->
                            <button class="btn" onclick="abrirModalDetalles(${maquina.id_maquinaria}, '${maquina.marca} ${maquina.modelo}', '${maquina.descripcion}', '${maquina.precio_dia}')">Ver más detalles</button>
                        </td>
                    `;
                    tbody.appendChild(fila);
                });
            } catch (error) {
                console.error('Error al cargar la maquinaria:', error);
            }
        }

        async function cargarMisReservas() {
            try {
                const respuesta = await fetch(`/api/reservas?id_productor=${encodeURIComponent(idProductor)}`);
                const reservas = await respuesta.json();
                
                const tbody = document.querySelector('#tablaMisReservas tbody');
                tbody.innerHTML = ''; 

                if (reservas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #6d6d6d;">No tienes reservas registradas.</td></tr>';
                    return;
                }

                reservas.forEach(reserva => {
                    let colorEstado = '#212529';
                    if (reserva.estado === 'Pendiente') colorEstado = '#f39c12';
                    if (reserva.estado === 'Confirmada') colorEstado = '#07503f'; 
                    if (reserva.estado === 'Cancelada') colorEstado = '#dc3545';

                    let botonValorar = '-';
                    if (reserva.estado === 'Confirmada') {
                        botonValorar = `<button class="btn" style="padding: 8px 16px; font-size: 13px;" onclick="abrirModalValoracion(${reserva.id_reserva}, ${reserva.id_proveedor})">Valorar</button>`;
                    }

                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>#${reserva.id_reserva}</td>
                        <td><strong>${reserva.marca} ${reserva.modelo}</strong></td>
                        <td>${reserva.fecha_inicio.substring(0,10)} al ${reserva.fecha_fin.substring(0,10)}</td>
                        <td>$${reserva.costo_estimado}</td>
                        <td style="color: ${colorEstado}; font-weight: 600;">${reserva.estado}</td>
                        <td>${botonValorar}</td>
                    `;
                    tbody.appendChild(fila);
                });
            } catch (error) {
                console.error('Error al cargar reservas:', error);
            }
        }

        // Carrusel de fotos en el modal de reserva (detalle de la máquina)
        async function cargarFotosMaquina(id_maquinaria) {
            const galeria = document.getElementById('galeriaFotosMaquina');
            const img = document.getElementById('fotoMaquinaActual');
            const contador = document.getElementById('contadorFotos');
            if (!galeria || !img) return;

            try {
                const respuesta = await fetch(`/api/maquinaria/fotos/${id_maquinaria}`);
                const fotos = respuesta.ok ? await respuesta.json() : [];
                const rutas = fotos.map(foto => foto.ruta_foto).filter(Boolean);

                if (rutas.length === 0) {
                    galeria.style.display = 'none';
                    if (contador) contador.style.display = 'none';
                    return;
                }

                const btnAnterior = document.getElementById('btnFotoAnterior');
                const btnSiguiente = document.getElementById('btnFotoSiguiente');
                let indice = 0;

                const pintar = () => {
                    img.src = rutas[indice];
                    img.alt = `Foto ${indice + 1} de ${rutas.length}`;
                    if (contador) contador.innerText = rutas.length > 1 ? `Foto ${indice + 1} de ${rutas.length}` : '';
                    const visibilidad = rutas.length > 1 ? 'visible' : 'hidden';
                    if (btnAnterior) btnAnterior.style.visibility = visibilidad;
                    if (btnSiguiente) btnSiguiente.style.visibility = visibilidad;
                };

                if (btnAnterior) btnAnterior.onclick = () => { indice = (indice - 1 + rutas.length) % rutas.length; pintar(); };
                if (btnSiguiente) btnSiguiente.onclick = () => { indice = (indice + 1) % rutas.length; pintar(); };

                pintar();
            } catch (error) {
                console.error('Error al cargar las fotos de la máquina:', error);
                galeria.style.display = 'none';
                if (contador) contador.style.display = 'none';
            }
        }

        // NUEVA FUNCIÓN: Modal de Detalles con Reserva integrada
        window.abrirModalDetalles = async (id_maquinaria, nombre_maquina, descripcion, precio) => {
            // 1. Buscamos las fotos
            let fotos = [];
            try {
                const resp = await fetch(`/api/maquinaria/fotos/${id_maquinaria}`);
                fotos = await resp.json();
            } catch (e) {
                console.error("Error al cargar fotos", e);
            }

            // 2. Armamos el HTML del modal
            const modalHTML = `
                <div class="modal-overlay" id="modalReserva">
                    <div class="modal-content" style="text-align: left; max-width: 900px; padding: 40px;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
                            <div>
                                <h3 style="font-family: var(--font-serif); font-size: 36px; margin-bottom: 5px;">${nombre_maquina}</h3>
                                <span style="font-size: 14px; color: #6d6d6d; text-transform: uppercase; letter-spacing: 1px;">Ficha Técnica</span>
                            </div>
                            <button class="btn-secondary" onclick="cerrarModal('modalReserva')" style="padding: 8px 15px; font-size: 20px; line-height: 1;">&times;</button>
                        </div>

                        <!-- Galería de Fotos (Carrusel) -->
                        <div id="galeriaFotosMaquina" style="display: flex; align-items: center; gap: 15px; margin-bottom: 30px;">
                            <button type="button" class="btn-secondary" id="btnFotoAnterior" style="padding: 10px 20px; font-size: 20px;">&lsaquo;</button>
                            <img id="fotoMaquinaActual" alt="Foto de la máquina" style="flex: 1; height: 350px; object-fit: cover; border-radius: 15px; background: #eee; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                            <button type="button" class="btn-secondary" id="btnFotoSiguiente" style="padding: 10px 20px; font-size: 20px;">&rsaquo;</button>
                        </div>
                        <p id="contadorFotos" style="text-align: center; font-size: 13px; color: #6d6d6d; margin: -15px 0 30px 0; font-weight: 500;"></p>

                        <div style="display: flex; gap: 40px; flex-wrap: wrap;">
                            <div style="flex: 1; min-width: 300px;">
                                <h4 style="font-size: 18px; margin-bottom: 15px; color: var(--color-charcoal);">Descripción de la Máquina</h4>
                                <p style="font-size: 15px; color: #353535; line-height: 1.6; margin-bottom: 30px;">${descripcion || 'Sin descripción adicional.'}</p>
                                <div style="background: var(--color-bone); padding: 20px; border-radius: 12px;">
                                    <p style="font-size: 14px; margin: 0; color: #353535;">
                                        <strong>Política de reserva:</strong><br>
                                        Para asegurar la máquina, debes pagar una seña del <strong>20%</strong> ($${(precio * 0.20).toLocaleString('es-CL')}). El resto se paga al finalizar.
                                    </p>
                                </div>
                            </div>

                            <div style="flex: 1; min-width: 300px; background: #fff; border: 1px solid var(--color-moss); padding: 25px; border-radius: 15px;">
                                <h4 style="font-size: 18px; margin-bottom: 20px; color: var(--color-charcoal);">Agendar Reserva</h4>
                                <div style="margin-bottom: 15px;">
                                    <label>Fecha de inicio:</label>
                                    <input type="date" id="fecha_inicio" required style="width: 100%;">
                                </div>
                                <div style="margin-bottom: 20px;">
                                    <label>Fecha de término:</label>
                                    <input type="date" id="fecha_fin" required style="width: 100%;">
                                </div>
                                <div style="margin-bottom: 20px; display: flex; align-items: flex-start; gap: 10px;">
                                    <input type="checkbox" id="aceptoTerminos" style="width: 18px; height: 18px; cursor: pointer; margin-top: 3px;">
                                    <label for="aceptoTerminos" style="margin: 0; cursor: pointer; font-size: 13px; font-weight: normal; line-height: 1.4;">Acepto los términos y el pago de la seña del 20%.</label>
                                </div>
                                <button class="btn" id="btnConfirmarReserva" disabled style="width: 100%; opacity: 0.5; padding: 15px;">Pagar Seña y Reservar</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHTML);
            const modal = document.getElementById('modalReserva');
            setTimeout(() => modal.classList.add('show'), 10);

            // Cargar el carrusel
            cargarFotosMaquina(id_maquinaria);

            // Lógica del checkbox y el botón de reservar
            const checkbox = document.getElementById('aceptoTerminos');
            const btnPagar = document.getElementById('btnConfirmarReserva');
            
            checkbox.addEventListener('change', (e) => {
                btnPagar.disabled = !e.target.checked;
                btnPagar.style.opacity = e.target.checked ? '1' : '0.5';
                btnPagar.style.cursor = e.target.checked ? 'pointer' : 'not-allowed';
            });

            btnPagar.onclick = async () => {
                const fecha_inicio = document.getElementById('fecha_inicio').value;
                const fecha_fin = document.getElementById('fecha_fin').value;

                if (!fecha_inicio || !fecha_fin) {
                    mostrarToast('Por favor, selecciona ambas fechas', 'error');
                    return;
                }

                btnPagar.innerText = 'Procesando pago...';
                btnPagar.disabled = true;

                setTimeout(async () => {
                    try {
                        const respuesta = await fetch('/api/reservas', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                id_productor: idProductor,
                                id_maquinaria: id_maquinaria,
                                fecha_inicio: fecha_inicio,
                                fecha_fin: fecha_fin
                            })
                        });

                        if (respuesta.ok) {
                            const data = await respuesta.json();
                            mostrarToast(`¡Pago de seña exitoso! Se abonaron $${data.monto_seña.toLocaleString('es-CL')}`, 'success');
                            cerrarModal('modalReserva');
                            cargarMisReservas();
                        } else {
                            const data = await respuesta.json();
                            mostrarToast(data.error || 'Error al reservar', 'error');
                            btnPagar.innerText = 'Pagar Seña y Reservar';
                            btnPagar.disabled = false;
                        }
                    } catch (error) {
                        console.error(error);
                        mostrarToast('Error de conexión al reservar', 'error');
                        btnPagar.innerText = 'Pagar Seña y Reservar';
                        btnPagar.disabled = false;
                    }
                }, 1500);
            };
        };

        window.abrirModalValoracion = (id_reserva, id_proveedor) => {
            const modalHTML = `
                <div class="modal-overlay" id="modalValoracion">
                    <div class="modal-content" style="text-align: left;">
                        <h3 style="font-family: var(--font-serif); font-size: 28px; margin-bottom: 10px;">Valorar Proveedor</h3>
                        <p style="color: #6d6d6d; margin-bottom: 25px;">¿Cómo fue tu experiencia con esta máquina?</p>
                        
                        <div style="margin-bottom: 20px;">
                            <label>Puntuación (1 a 5):</label>
                            <input type="number" id="puntuacion" min="1" max="5" required placeholder="5">
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label>Comentario:</label>
                            <textarea id="comentario" rows="3" placeholder="Excelente servicio..."></textarea>
                        </div>
                        
                        <div class="modal-buttons">
                            <button class="btn-secondary" onclick="cerrarModal('modalValoracion')">Cancelar</button>
                            <button class="btn" id="btnEnviarValoracion">Enviar Valoración</button>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHTML);
            const modal = document.getElementById('modalValoracion');
            setTimeout(() => modal.classList.add('show'), 10);

            document.getElementById('btnEnviarValoracion').onclick = async () => {
                const puntuacion = document.getElementById('puntuacion').value;
                const comentario = document.getElementById('comentario').value;

                const nota = Number(puntuacion);
                if (!Number.isInteger(nota) || nota < 1 || nota > 5) {
                    mostrarToast('La puntuación debe ser un número entero entre 1 y 5', 'error');
                    return;
                }

                try {
                    const respuesta = await fetch('/api/reservas/valorar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            id_reserva: id_reserva,
                            id_productor: idProductor,
                            id_proveedor: id_proveedor,
                            puntuacion: nota,
                            comentario: comentario
                        })
                    });

                    const data = await respuesta.json();
                    if (respuesta.ok) {
                        mostrarToast('¡Gracias por tu valoración!', 'success');
                        cerrarModal('modalValoracion');
                        cargarMisReservas();
                    } else {
                        mostrarToast(data.error || 'Error al enviar valoración', 'error');
                    }
                } catch (error) {
                    console.error(error);
                    mostrarToast('Error de conexión', 'error');
                }
            };
        };

        window.cerrarModal = (idModal) => {
            const modal = document.getElementById(idModal);
            if (modal) {
                modal.classList.remove('show');
                setTimeout(() => modal.remove(), 400);
            }
        };

        function mostrarToast(mensaje, tipo) {
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerText = mensaje;
            document.body.appendChild(toast);
            setTimeout(() => { toast.classList.add('show'); }, 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
    </script>
    <script src="header.js"></script>
</body>
</html>
