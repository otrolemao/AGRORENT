<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroRent - Panel de Administración</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .btn-logout {
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-logout:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <header class="header-admin">
        <h1>AgroRent - Panel de Administración</h1>
        <a href="index.html" class="btn-logout">Cerrar Sesión</a>
    </header>

    <div class="container">
        <h2>Métricas del Sistema</h2>
        
        <div style="display: flex; gap: 20px; margin-top: 20px;">
            <div style="flex: 1; background: #ecf0f1; padding: 20px; border-radius: 8px; text-align: center;">
                <h3>Usuarios Registrados</h3>
                <p id="totalUsuarios" style="font-size: 24px; font-weight: bold; color: #2c3e50;">-</p>
            </div>
            <div style="flex: 1; background: #ecf0f1; padding: 20px; border-radius: 8px; text-align: center;">
                <h3>Maquinaria Registrada</h3>
                <p id="totalMaquinas" style="font-size: 24px; font-weight: bold; color: #2c3e50;">-</p>
            </div>
            <div style="flex: 1; background: #ecf0f1; padding: 20px; border-radius: 8px; text-align: center;">
                <h3>Reservas Activas</h3>
                <p id="totalReservas" style="font-size: 24px; font-weight: bold; color: #2c3e50;">-</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const respuesta = await fetch('/api/admin/metricas');
                const data = await respuesta.json();

                document.getElementById('totalUsuarios').innerText = data.usuarios_registrados;
                document.getElementById('totalMaquinas').innerText = data.maquinaria_registrada;
                document.getElementById('totalReservas').innerText = data.reservas_activas;
            } catch (error) {
                console.error('Error al cargar métricas', error);
            }
        });
    </script>
</body>
</html>
