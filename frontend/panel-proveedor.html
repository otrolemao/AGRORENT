<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Proveedor - AgroRent</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .table-container { background: white; padding: 20px; border-radius: 8px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #1b5e20; color: white; }
        .btn-aceptar { background: #2e7d32; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-rechazar { background: #c62828; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Panel Proveedor </h1>
            <nav>
                <a href="index.html">Volver al Catálogo</a>
            </nav>
        </div>
    </header>
    <main>
        <h2>Gestión de Reservas Recibidas</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID Reserva</th>
                        <th>ID Máquina</th>
                        <th>Fechas</th>
                        <th>Monto Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaReservas">
                    <!-- Las filas se insertarán con JavaScript -->
                </tbody>
            </table>
        </div>
    </main>
    <script src="js/proveedor.js"></script>
</body>
</html>
