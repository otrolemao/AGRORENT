<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Proveedor - AgroRent</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>AgroRent</h1>
        <div class="header-user">
            <span id="nombreUsuario">Cargando...</span>
            <a href="#" class="btn-logout" onclick="cerrarSesion(event)">Cerrar Sesión</a>
        </div>
    </header>

    <div class="container">
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="abrirTab(event, 'tab-maquinas')">Mis Máquinas</button>
            <button class="tab-btn" onclick="abrirTab(event, 'tab-publicar')">Publicar Máquina</button>
            <button class="tab-btn" onclick="abrirTab(event, 'tab-reservas')">Reservas Recibidas</button>
        </div>

        <div id="tab-maquinas" class="tab-content active">
            <div class="card">
                <h2>Mi Inventario</h2>
                <table id="tablaMaquinaria">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Precio/Día</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="tab-publicar" class="tab-content">
            <div class="card" style="max-width: 650px; margin: 0 auto;">
                <h2>Publicar Nueva Máquina</h2>
                <!-- IMPORTANTE: enctype="multipart/form-data" permite enviar archivos -->
                <form id="formMaquinaria" enctype="multipart/form-data">
                    <div style="margin-bottom: 25px;">
                        <label>Marca:</label>
                        <input type="text" id="marca" required maxlength="50" minlength="2" placeholder="Ej: John Deere">
                    </div>
                    
                    <div style="margin-bottom: 25px;">
                        <label>Modelo:</label>
                        <input type="text" id="modelo" required maxlength="50" minlength="1" placeholder="Ej: 6120M">
                    </div>

                    <div style="margin-bottom: 25px;">
                        <label>Categoría:</label>
                        <select id="categoria" required>
                            <option value="">Cargando categorías...</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 25px; display: flex; gap: 20px;">
                        <div style="flex: 1;">
                            <label>Año:</label>
                            <input type="number" id="anio" required min="1950" max="2026" placeholder="2020">
                        </div>
                        <div style="flex: 1;">
                            <label>Patente:</label>
                            <input type="text" id="patente" required maxlength="8" pattern="[A-Za-z]{4}-[0-9]{2,3}" title="Formato: ABCD-12" placeholder="ABCD-12">
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 25px;">
                        <label>Precio por Día (CLP):</label>
                        <input type="number" id="precio_dia" required min="1000" step="1000" placeholder="150000">
                    </div>

                    <div style="margin-bottom: 25px;">
                        <label>Descripción:</label>
                        <textarea id="descripcion" rows="4" maxlength="250" placeholder="Detalles de la máquina... (Máx. 250 caracteres)"></textarea>
                    </div>

                    <!-- NUEVO CAMPO PARA LA FOTO -->
                    <div style="margin-bottom: 25px;">
                        <label>Foto de la máquina:</label>
                        <input type="file" id="foto" name="foto" accept="image/*" style="padding: 10px; border: 1px solid var(--color-moss); border-radius: 10px; width: 100%;">
                    </div>

                    <button type="submit" class="btn" style="width: 100%;">Guardar Máquina</button>
                </form>
            </div>
        </div>

        <div id="tab-reservas" class="tab-content">
            <div class="card">
                <h2>Reservas Pendientes</h2>
                <table id="tablaReservas">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Máquina</th>
                            <th>Fechas</th>
                            <th>Costo Est.</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const usuarioGuardado = JSON.parse(localStorage.getItem('agrorent_usuario'));
        if (usuarioGuardado && usuarioGuardado.nombre) {
            document.getElementById('nombreUsuario').innerText = usuarioGuardado.nombre;
        }

        function cerrarSesion(e) {
            e.preventDefault();
            localStorage.removeItem('agrorent_usuario');
            window.location.href = 'index.html';
        }

        function abrirTab(evt, tabName) {
            let tabcontent = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabcontent.length; i++) {
                tabcontent[i].classList.remove("active");
            }
            let tablinks = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
    <script src="proveedor.js"></script>
</body>
</html>
