<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Proveedor - AgroRent</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .header-proveedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .btn-logout {
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-logout:hover { background-color: #c0392b; }
        .btn-aceptar { background-color: #27ae60; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-rechazar { background-color: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header class="header-proveedor">
        <h1>AgroRent - Panel de Proveedor</h1>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="nombreUsuario" style="font-weight: bold; color: white;"></span>
            <a href="#" class="btn-logout" onclick="cerrarSesion(event)">Cerrar Sesión</a>
        </div>
    </header>

    <div class="container">
        <h2>Registrar Nueva Maquinaria</h2>
        
        <form id="formMaquinaria">
            <div style="margin-bottom: 15px;">
                <label for="marca">Marca:</label><br>
                <input type="text" id="marca" required style="width: 100%; padding: 8px;">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label for="modelo">Modelo:</label><br>
                <input type="text" id="modelo" required style="width: 100%; padding: 8px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="categoria">Categoría:</label><br>
                <select id="categoria" required style="width: 100%; padding: 8px;">
                    <option value="">Cargando categorías...</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label for="anio">Año:</label><br>
                <input type="number" id="anio" required style="width: 100%; padding: 8px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="patente">Patente:</label><br>
                <input type="text" id="patente" required 
                       pattern="[A-Za-z]{4}-[0-9]{2,3}" 
                       title="Formato válido: ABCD-12"
                       style="width: 100%; padding: 8px;">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label for="precio_dia">Precio por Día:</label><br>
                <input type="number" id="precio_dia" required style="width: 100%; padding: 8px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="descripcion">Descripción:</label><br>
                <textarea id="descripcion" rows="3" style="width: 100%; padding: 8px;"></textarea>
            </div>

            <button type="submit" class="btn">Guardar Maquinaria</button>
        </form>

        <hr style="margin: 30px 0;">

        <h2>Mis Máquinas Registradas</h2>
        <table id="tablaMaquinaria">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Precio/Día</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <hr style="margin: 30px 0;">

        <h2>Reservas Recibidas</h2>
        <table id="tablaReservas">
            <thead>
                <tr>
                    <th>ID Reserva</th>
                    <th>Máquina</th>
                    <th>Fechas</th>
                    <th>Costo Est.</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script>
        const usuarioGuardado = JSON.parse(localStorage.getItem('agrorent_usuario'));
        if (usuarioGuardado && usuarioGuardado.nombre) {
            document.getElementById('nombreUsuario').innerText = usuarioGuardado.nombre;
        }

        function cerrarSesion(e) {
            e.preventDefault();
            localStorage.removeItem('agrorent_usuario');
            window.location.href = 'index.html';
        }
    </script>
    <script src="proveedor.js"></script>
</body>
</html>
