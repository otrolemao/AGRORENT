<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Proveedor - AgroRent</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>AgroRent - Panel de Proveedor</h1>
    </header>

    <div class="container">
        <h2>Registrar Nueva Maquinaria</h2>
        
        <form id="formMaquinaria">
            <div style="margin-bottom: 15px;">
                <label for="marca">Marca:</label><br>
                <input type="text" id="marca" required style="width: 100%; padding: 8px;">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label for="modelo">Modelo:</label><br>
                <input type="text" id="modelo" required style="width: 100%; padding: 8px;">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label for="precio_dia">Precio por Día:</label><br>
                <input type="number" id="precio_dia" required style="width: 100%; padding: 8px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="descripcion">Descripción:</label><br>
                <textarea id="descripcion" rows="3" style="width: 100%; padding: 8px;"></textarea>
            </div>

            <button type="submit" class="btn">Guardar Maquinaria</button>
        </form>

        <hr style="margin: 30px 0;">

        <h2>Mis Máquinas Registradas</h2>
        <table id="tablaMaquinaria">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Precio/Día</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se cargarán las máquinas con JavaScript -->
            </tbody>
        </table>
    </div>

    <script src="proveedor.js"></script>
</body>
</html>
