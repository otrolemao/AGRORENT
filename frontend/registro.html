<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroRent - Registro de Usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>AgroRent</h1>
    </header>

    <div class="container" style="max-width: 500px; margin-top: 50px;">
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 30px;">Crear Cuenta</h2>
            
            <form id="registroForm">
                <div style="margin-bottom: 20px;">
                    <label>Nombre Completo:</label>
                    <input type="text" id="nombre" required maxlength="100" minlength="3" placeholder="Ej: Juan Pérez">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="email" required maxlength="100" placeholder="correo@ejemplo.cl">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label>Contraseña:</label>
                    <input type="password" id="password" required minlength="6" maxlength="50" placeholder="Mínimo 6 caracteres">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label>Teléfono:</label>
                    <input type="text" id="telefono" required maxlength="20" placeholder="Ej: +56912345678">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label>RUT:</label>
                    <!-- Validación con patrón chileno y largo máximo -->
                    <input type="text" id="rut" placeholder="Ej: 12.345.678-9" required maxlength="12" pattern="[0-9]{1,2}\.?[0-9]{3}\.?[0-9]{3}-?[0-9kK]" title="Ingrese un RUT válido (Ej: 12.345.678-9)">
                </div>
                
                <div style="margin-bottom: 30px;">
                    <label>¿Cuál es tu rol?</label>
                    <select id="rol" required>
                        <option value="1">Productor Agrícola (Cliente)</option>
                        <option value="2">Proveedor (Dueño de maquinaria)</option>
                    </select>
                </div>
                
                <button type="submit" class="btn" style="width: 100%;">Registrarse</button>
            </form>
            
            <p style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: var(--color-forest-ink); text-decoration: none; font-weight: 500;">¿Ya tienes cuenta? Inicia sesión aquí</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nuevoUsuario = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                telefono: document.getElementById('telefono').value,
                rut: document.getElementById('rut').value,
                rol: Number(document.getElementById('rol').value)
            };

            try {
                const respuesta = await fetch('/api/auth/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoUsuario)
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    mostrarToast('¡Usuario registrado con éxito!', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html'; 
                    }, 2000);
                } else {
                    mostrarToast(data.error || 'Error al registrar', 'error');
                }
            } catch (error) {
                console.error(error);
                mostrarToast('Error de conexión con el servidor', 'error');
            }
        });

        function mostrarToast(mensaje, tipo) {
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerText = mensaje;
            document.body.appendChild(toast);
            setTimeout(() => { toast.classList.add('show'); }, 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
